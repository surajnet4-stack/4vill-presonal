plugins {
    id 'fabric-loom' version '1.14.10'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "azure-client-${project.minecraft_version}"
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'minecraft_version': project.minecraft_version
    }
}

// Minecraft 1.21.x requires Java 21; older targets keep Java 17 bytecode.
def is121 = project.minecraft_version.startsWith("1.21")
def is12111 = project.minecraft_version == "1.21.11"
def targetJava = is121 ? 21 : 17

if (is12111) {
    // Minecraft 1.21.11 has incompatible rendering and input APIs; keep its client entry point isolated.
    sourceSets.main.java.setSrcDirs(['src/1.21.11/java'])
    sourceSets.main.resources.setSrcDirs(['src/1.21.11/resources'])
}

java {
    sourceCompatibility = is121 ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17
    targetCompatibility = sourceCompatibility
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = targetJava
}
