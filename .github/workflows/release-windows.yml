name: Publish Windows launcher

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Set app version from release tag
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag must use vX.Y.Z format; got $env:GITHUB_REF_NAME"
          }
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($packageVersion -ne $version) {
            npm version $version --no-git-tag-version
            if ($LASTEXITCODE -ne 0) {
              throw "Could not set package version to $version"
            }
          }

      - name: Build and publish installer and update metadata
        run: npm run release:windows
